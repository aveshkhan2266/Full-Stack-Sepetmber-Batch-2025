<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let num = parseInt(prompt("Enter element"));
        let names = [];

        for (let i = 0; i < num; i++) {
            names[i] = prompt("Enter name");
        }

        document.write("Store name: <br>");
        for (let i = 0; i < num; i++) {
            document.write(names[i] + "<br>");
        }
    </script>
</body>

</html>
