<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <input type="text" placeholder="Enter Your Value... " id="typ" autofocus>
    
    <button onclick="show()">Click Me</button>

    <input type="text" placeholder="Enter Your Value... " id="pyp">

    <script>
        function show()
        {
            pyp.value=typ.value;
            typ.value="";
        }
    </script>
</body>
</html>
