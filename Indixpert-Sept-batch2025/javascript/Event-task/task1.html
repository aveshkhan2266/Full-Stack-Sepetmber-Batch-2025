<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="number" placeholder="Enter Your Value..." id="int">

    <input type="number" placeholder="Enter Your Value..." id="put">

    <button onclick="show()">add</button>

    <p id="res"></p>

    <script>
        function show() {
            res.innerHTML = parseInt(int.value) + parseInt(put.value);
            // res.innerHTML="Hello world";
        }
    </script>

</body>

</html>
