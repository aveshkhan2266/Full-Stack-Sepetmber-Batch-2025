<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>HTML media element & iframe</h1>
    </header>

    <main>
        <section>
            <h2>image</h2>
            <img src="../images/indixpert-logo.png" alt="the indixpert-logo" height="300" width="800">
        </section>
        <section>
            <h2>audio</h2>
            <audio controls loop muted>
                <source src="aud.mp3" type="audio/mp3">
                <source src="aud.ogg" type="audio/ogg">
                the browser does not support this audio
            </audio>
        </section>
        <section>
            <h2>video</h2>
            <video controls loop height="200" width="500">
                <source src="video.mp4" type="video/mp4">
                <source src="video2.ogg" type="video/ogg">
                the browser does not support this video
            </video>
        </section>
        <section>
            <h2>youtube video</h2>
            <iframe width="560" height="315"
                src="https://www.youtube.com/embed/7wnove7K-ZQ?si=Av35NRHSv_TSLyKa&amp;start=80"
                title="YouTube video player" frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </section>
        <section>
            <h2>MAP</h2>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d228974.83788362748!2d72.73516065288366!3d26.270365195272127!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39418c4eaa06ccb9%3A0x8114ea5b0ae1abb8!2sJodhpur%2C%20Rajasthan!5e0!3m2!1sen!2sin!4v1770375400100!5m2!1sen!2sin"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
    </main>
</body>

</html>
