<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>HTML List</title>
    </head>
    <body>
        <header>
            <h1>HTML List</h1>
        </header>
        <main>
            <section>
                <h2>Unordered List</h2>
                <ul>
                    <li>Mango</li>
                    <li>Apple</li>
                    <li>Papaya</li>
                    <li>Banana</li>
                    <li>Orange</li>
                </ul>
            </section>
            <section>
                <h2>Ordered List</h2>
                <ol>
                    <li>Orange</li>
                    <li>Papaya</li>
                    <li>Apple</li>
                    <li>Mango</li>
                    <li>Banana</li>
                </ol>
                <ol type="I">
                    <li>Orange</li>
                    <li>Papaya</li>
                    <li>Apple</li>
                    <li>Mango</li>
                    <li>Banana</li>
                </ol>
                <ol type="A">
                    <li>Orange</li>
                    <li>Papaya</li>
                    <li>Apple</li>
                    <li>Mango</li>
                    <li>Banana</li>
                </ol>
            </section>
            
        </main>
    </body>
