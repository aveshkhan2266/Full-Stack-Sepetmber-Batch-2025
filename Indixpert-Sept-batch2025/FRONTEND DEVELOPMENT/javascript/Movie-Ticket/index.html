<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <h3 class="my-3 text-center name" >Aavesh Movie Hall</h3>
        <div class="row my-5">
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://m.media-amazon.com/images/I/91A7OAiNwWL._UF1000,1000_QL80_.jpg" alt=""
                        class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">Captain America</h3>
                        <h4>200₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="CA" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://play-lh.googleusercontent.com/gU62T8eIfe1xBFI-Kl-hs6Sx6Wh8Vhh-GuxMFrVSnjKgrGXMfXXwIqJjEYbfzgjvn4jS"
                        alt="" class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">Sultan</h3>
                        <h4>150₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="ST" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://m.media-amazon.com/images/M/MV5BNDVlYWYzNDUtZTM3Ny00OTI5LThiZDQtNTA0YjFhMTE1YTdjXkEyXkFqcGc@._V1_.jpg"
                        alt="" class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">KGF</h3>
                        <h4>250₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="KGF" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://m.media-amazon.com/images/M/MV5BYzVjMjZiNGUtZjZiNy00Yzg4LWEzYzYtMmI1NDg5NWNiNjUwXkEyXkFqcGc@._V1_.jpg"
                        alt="" class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">Bajrangi Bhaijaan</h3>
                        <h4>100₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="BB" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRT1dyGdgSOMs7HAdYaavNFvw8Djq0cwY1puLUN5djEXnpo97dLA54yrADW&s=10"
                        alt="" class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">Avengers</h3>
                        <h4>300₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="Ag" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://assets-in.bmscdn.com/iedb/movies/images/mobile/thumbnail/xlarge/alpha-et00403805-1781695445.jpg"
                        alt="" class="card-img-top" height="330px">
                    <div class="card-body text-center">
                        <h3 class="my-3">Alpha</h3>
                        <h4>150₹</h4>
                        <button class="btn btn-warning mt-3">
                            <div class="form-check">
                                <input type="radio" id="Aa" class="form-check-input" name="movie">Book
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row my-3">
            <div class="col-sm-6">
                <input type="text" placeholder="Enter seat numbers" class="my-5 form-control" id="SeatNum">
            </div>
            <div class="col-sm-6">
                <select id="seatType" class="my-5 form-select text-center">
                    <option value="silver">Silver ( 0₹ extra charges )</option>
                    <option value="gold">Gold ( 100₹ extra charges )</option>
                    <option value="platinum">Platinum ( 200₹ extra charges )</option>
                </select>
            </div>

            <div class="col-sm-12 text-center">
                <button class="btn btn-primary" onclick="bill()">Bill</button>
            </div>

            <div class="col-sm-12 text-center mt-5">
                <h3><span id="MovieName"></span></h3>
                <h3><span id="MoviePrice"></span></h3>
                <h3><span id="SeatNumber"></span></h3>
                <h3><span id="SeatType"></span></h3>
                <h3><span id="TotalBill"></span></h3>
            </div>
        </div>


    </div>



    <script src="script.js"></script>
</body>

</html>
