<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="container text-center">
        <h3 class="my-3 text-center name">Avesh Movie Hall</h3>
        <div class="row my-5">
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBHuijcDqq1e-2kRx2RbZqHAItrnpksbsA7eK8rTdoow&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">Avengers</h3>
                    <h4>250₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_e3VAA2enJpqKBr9yCkO2Q9GgRcZ9-2M4MI9Q9smIQg&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">Sultan</h3>
                    <h4>200₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS6oM98JF9ETmnIOU-D6zW_AOMBs7br3Jb4-3oYJQSUog&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">PK</h3>
                    <h4>200₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRcBc86YlOMFJz_rGeYh08BnuiiwNuAGiO71ez3-BQj9Q&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">Phushpa 2</h3>
                    <h4>300₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
           
        </div>
        <div class="row">
             <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBHuijcDqq1e-2kRx2RbZqHAItrnpksbsA7eK8rTdoow&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">Avengers</h3>
                    <h4>250₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTBHuijcDqq1e-2kRx2RbZqHAItrnpksbsA7eK8rTdoow&s=10"
                        alt="" class="card-img-top" height="350px">
                    <h3 class="my-3">Avengers</h3>
                    <h4>250₹</h4>
                    <button class="btn btn-warning mt-3">
                        <div class="form-check">
                            <input type="radio" class="form-check-input" name="movie">Book
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row my-3">
        <div class="col-sm-6">
            <input type="text" placeholder="Enter Seat Number" class="my-5 form-control" id="seatnum">
        </div>
        <div class="col-sm-6">
            <select id="seatType" class="my-5 form-select text-center">
                <option value="silver">Silver ( 0₹ extra charges )</option>
                <option value="silver">Glold ( 0₹ extra charges )</option>
                <option value="silver">Platinum ( 0₹ extra charges )</option>
            </select>
        </div>
        <div class="col-sm-12 text-center">
            <button class="btn btn-primary" onclick="bill"></button>
        </div>
        <div>
            <div class="col-sm-12 text-center mt-5">
                <h3><span id="MovieName"></span></h3>
                <h3><span id="MoviePrice"></span></h3>
                <h3><span id="SeatNumber"></span></h3>
                <h3><span id="SeatType"></span></h3>
                <h3><span id="TotalBill"></span></h3>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
