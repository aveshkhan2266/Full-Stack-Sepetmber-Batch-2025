<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="Enter value here...." id="inp" autofocus>
    
    <button onclick="show()">Click</button>

    <script>
        function show(){
            alert(inp.value);
            inp.value="";
            inp.focus();
        }
    </script>
</body>
</html>
