<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        a = parseInt(prompt("Enter Your Number"))
        b = parseInt(prompt("Enter Your Number"))

        document.write("Addition is :" + (a+=b) + "<br>")
        document.write("Subtraction is :" + (a-=b) + "<br>")
        document.write("Divide is :" + (a/=b) + "<br>")
        document.write("Module is :" + (a%=b) + "<br>")
    </script>
</body>
</html>
