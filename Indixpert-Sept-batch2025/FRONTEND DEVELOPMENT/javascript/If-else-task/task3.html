<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const a = parseInt(prompt("Enter Your Number ="));

        if (a > 0)
        {
            document.write("Positive Number"+a);
        }
        else if (a < 0)
        {
            document.write("Negstive Number"+a);
        }


    </script>
</body>
</html>
