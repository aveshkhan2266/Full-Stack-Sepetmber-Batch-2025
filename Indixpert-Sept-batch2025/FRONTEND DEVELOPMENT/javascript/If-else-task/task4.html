<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const Number = parseInt(prompt("Enter Your Number ="))

        if (Number % 5 == 0)
    {
        document.write("divisible by 5");
    }
    else
    {
        document.write("not divisible by 5");
    }
    </script>
</body>
</html>
