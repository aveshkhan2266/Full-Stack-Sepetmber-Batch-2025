<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-4"></div>
            <div class="col-sm-4">
                <h3 class="mt-3 text-center">Bootstrap form</h3>

                <form>
                    <label class="form-label">Username :</label>
                    <input type="text" placeholder="Enter your username" class="form-control">
                    <label class="form-label mt-3">Email :</label>
                    <input type="email" placeholder="Enter your email" class="form-control">
                    <label class="form-label mt-3">Password :</label>
                    <input type="password" placeholder="Enter your password" class="form-control">
                    <div class="form-check mt-4">
                        <label class="form-check-label">
                            <input type="checkbox" class="form-check-input"> Check me
                        </label>
                    </div>

                    <div class="form-check">
                        <label class="form-check-label">
                            <input type="radio" class="form-check-input" name="gender">Male
                        </label>
                    </div>
                    <div class="form-check">
                        <label class="form-check-label">
                            <input type="radio" class="form-check-input" name="gender">Female
                        </label>
                    </div>

                    <select class="form-select mt-3">
                        <option>Jodhpur</option>
                        <option>Jaipur</option>
                        <option>Udaipur</option>
                        <option>Delhi</option>
                        <option>Mumbai</option>
                    </select>

                    <input type="range" class="form-control mt-3">

                    <div class="input-group my-3">
                        <span class="input-group-text">Username : </span>
                        <input type="text" class="form-control">
                    </div>
                    <div class="input-group my-3">
                        <input type="text" class="form-control">
                        <span class="input-group-text">@gmail.com</span>
                    </div>


                    <div class="form-floating my-5">
                        <input type="text" class="form-control" placeholder="Enter username here...">
                        <label>Username</label>
                    </div>


                    <div class="form-floating my-5">
                        <input type="email" class="form-control" placeholder="Enter email here...">
                        <label>Email</label>
                    </div>
                </form>
            </div>
            <div class="col-sm-4"></div>
        </div>
    </div>
</body>

</html>
